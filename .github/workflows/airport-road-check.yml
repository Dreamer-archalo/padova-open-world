name: Airport road regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  airport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Airport road module syntax
        run: |
          node --check dist/airport-road-network.js
          node --check dist/gameplay-areas.js
          node --check verify-airport-mobility.mjs
      - name: Connected airport roads and building clearance
        run: node verify-airport-mobility.mjs
      - name: Existing runway, driving, vehicle and collision regression
        run: npm run test:airport
