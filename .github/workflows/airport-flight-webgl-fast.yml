name: Airport missile and radar WebGL
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/airport-flight-extras.js'
      - 'dist/airport-combat-flight.js'
      - 'dist/airport-ejection-state.js'
      - 'dist/phase2-runtime.js'
      - 'tools/test-airport-missile-map-chromium.mjs'
      - 'tools/test-airport-combat-flight-chromium.mjs'
      - '.github/workflows/airport-flight-webgl-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jet-radar-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Start game server
        run: |
          node tools/serve.mjs --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 25); do if curl -fsS http://127.0.0.1:4173/ -o /dev/null; then break; fi; sleep 1; done
      - name: Test jet launch and aerial M map in Chromium WebGL
        run: node tools/test-airport-missile-map-chromium.mjs
      - name: Test Blackbird flight, ejection, interception and radar colors
        if: always()
        run: node tools/test-airport-combat-flight-chromium.mjs
      - name: Upload screenshots and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jet-missile-radar-webgl
          path: test-artifacts/
          if-no-files-found: ignore
