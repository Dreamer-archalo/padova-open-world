name: Release smoke tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release manifest and deploy directory
        run: |
          test -f dist/index.html
          node --input-type=module -e "import fs from 'node:fs'; const v=JSON.parse(fs.readFileSync('dist/version.json')); if(!v.version || v.publishDirectory!=='dist') process.exit(1);"
      - name: Taxi and two Tangenziale races
        run: |
          npm run test:taxi
          npm run test:tangenziale-race
      - name: Online race regression
        run: |
          node verify-online-race.mjs
          node verify-online-race-second-fix.mjs
      - name: Startup and geometry regression
        run: |
          npm run test:initial-world
          npm run test:geometry-integrity
