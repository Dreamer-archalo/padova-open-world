name: Solo game and collector cars R26 preview

on:
  push:
    branches: [feat/solo-collector-cars-r26]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover the last published regional map
        run: |
          set -euo pipefail
          for name in venice.json region-padova-venice.json world-padova-venice.json world-terrain.json map-hd-extras.json; do
            found=false
            for label in padova-npc-r17 dealerships-r19 unified; do
              url="https://dreamer-archalo.github.io/padova-open-world/preview/$label/data/$name"
              if curl --fail --silent --show-error --location --max-time 45 "$url" -o "dist/data/$name"; then
                echo "Recovered $name from $label"
                found=true
                break
              fi
            done
            if test "$found" != true && test "$name" != map-hd-extras.json; then
              echo "Missing required regional file: $name" >&2
              exit 1
            fi
          done
      - name: Check regional data and mapped showrooms
        run: |
          set -euo pipefail
          for name in venice.json region-padova-venice.json world-padova-venice.json world-terrain.json; do
            test -s "dist/data/$name"
          done
          node -e "for(const n of ['region-padova-venice','world-padova-venice','world-terrain','venice']){const d=require('./dist/data/'+n+'.json'); if(!d||typeof d!=='object')process.exit(1)}"
          node verify-dealerships-regional.mjs
          node tools/audit-regional-interchanges-r20.mjs
      - name: Verify changed features
        run: |
          set -euo pipefail
          node verify-collector-cars-r26.mjs
          node tools/verify-mandria-hangar.mjs
          node tools/verify-mandria-catalog-ui.mjs
          node verify-hangar-air.mjs
          npm run test:taxi-r22
          npm run test:taxi
          npm run test:vehicle-damage
          npm run test
          npm run test:performance
          npm run test:venice-performance
          npm run test:initial-world
          npm run test:street-life
          npm run test:phase3-city
      - name: Install Chromium for road mesh verification
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Verify contextual HUD, minimap size and six-second notifications
        run: node tools/test-compact-hud-r26-layout.mjs
      - name: Verify solo startup, compact HUD and all 15 collector cars
        run: node tools/test-solo-collector-r26-browser.mjs
      - name: Retain collector fleet and HUD screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solo-collector-cars-r26-webgl
          path: test-artifacts/r26
          if-no-files-found: ignore
      - name: Verify R25 road meshes in real WebGL
        run: node tools/test-northeast-roads-r25-browser.mjs
      - name: Retain road geometry screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northeast-roads-r25-webgl
          path: test-artifacts/r25
          if-no-files-found: ignore
      - uses: actions/checkout@v6
        with:
          ref: 7ad45f1332c3b95a79518336ddd9a9929d56857d
          path: .prior-road-fixes
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 1a053682b054087a4d36638c459b6afc5295f92d
          path: .prior-road-stunts
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: fix/taxi-confirm-map-r22
          path: .prior-taxi-r22
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: feat/padova-road-levels-r21
          path: .prior-road-levels
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: feat/padova-intelligent-npc-r17
          path: .prior-padova-r17
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: feat/dealerships-urban-showrooms
          path: .prior-dealerships
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: main
          path: .production-source
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: fix/regional-taxi-20260928
          path: .prior-unified
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: feat/padova-venice-continuous-20260925
          path: .prior-continuous
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: feat/venice-world-20260924
          path: .prior-venice
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: feat/monoblocco-elevators-20260924
          path: .pr57
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: fix/shared-street-surface-20260922
          path: .pr56
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: feat/villa-treves-phase1-20260919
          path: .pr51
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 20c6411c215ad57bdc1a57df0f0ae69554d241c2
          path: .pr52
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: cb6d5fb1f3afedfda68f8f07651916d3a8e12f28
          path: .mandria-v11
          persist-credentials: false
      - name: Assemble isolated previews and retain production
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .production-source/dist/index.html .production-source/dist/game.js > /tmp/production-root.sha
          for item in 'solo-cars-r26 .' 'road-fixes-r25 .prior-road-fixes' 'road-stunts-r23 .prior-road-stunts' 'taxi-r22 .prior-taxi-r22' 'road-levels-r21 .prior-road-levels' 'padova-npc-r17 .prior-padova-r17' 'dealerships .prior-dealerships' 'unified .prior-unified' 'continuous .prior-continuous' 'venice .prior-venice' 'pr-57 .pr57' 'pr-56 .pr56' 'pr-51 .pr51' 'pr-52 .pr52' 'mandria-v11 .mandria-v11'; do
            read -r label source <<< "$item"
            mkdir -p ".production-source/dist/preview/$label"
            cp -a "$source/dist/." ".production-source/dist/preview/$label/"
          done
          for label in unified continuous venice; do
            cp dist/data/venice.json dist/data/world-padova-venice.json dist/data/world-terrain.json ".production-source/dist/preview/$label/data/"
          done
          cp dist/data/region-padova-venice.json .production-source/dist/preview/unified/data/
          cp dist/data/region-padova-venice.json dist/data/world-terrain.json .production-source/dist/preview/padova-npc-r17/data/
          for label in taxi-r22 road-levels-r21 road-stunts-r23 road-fixes-r25; do
            for name in venice.json region-padova-venice.json world-padova-venice.json world-terrain.json; do
              cp "dist/data/$name" ".production-source/dist/preview/$label/data/$name"
            done
          done
          if test -s dist/data/map-hd-extras.json; then
            for label in taxi-r22 road-levels-r21 road-stunts-r23 road-fixes-r25; do
              cp dist/data/map-hd-extras.json ".production-source/dist/preview/$label/data/"
            done
          fi
          for name in venice.json region-padova-venice.json world-padova-venice.json world-terrain.json; do
            cp "dist/data/$name" ".production-source/dist/data/$name"
          done
          if test -s dist/data/map-hd-extras.json; then
            cp dist/data/map-hd-extras.json .production-source/dist/data/
          fi
          touch .production-source/dist/.nojekyll
          test -s .production-source/dist/preview/solo-cars-r26/data/region-padova-venice.json
          grep -q 'game.js?v=solo-cars-r26' .production-source/dist/preview/solo-cars-r26/index.html
          sha256sum -c /tmp/production-root.sha
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .production-source/dist
      - uses: actions/deploy-pages@v4
      - name: Verify the public R26 preview
        run: |
          set -euo pipefail
          base='https://dreamer-archalo.github.io/padova-open-world/preview/solo-cars-r26'
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location "$base/index.html" -o /tmp/road-stunts-r23-preview.html &&
               curl --fail --silent --show-error --location "$base/game.js" -o /tmp/road-stunts-r23-game.js &&
               curl --fail --silent --show-error --location "$base/taxi-map-ui.js" -o /tmp/road-stunts-r23-map-ui.js &&
               curl --fail --silent --show-error --location "$base/unified-map.js" -o /tmp/road-stunts-r23-unified-map.js &&
               grep -q 'game.js?v=solo-cars-r26' /tmp/road-stunts-r23-preview.html &&
               grep -q 'mapWheelZoomFactor' /tmp/road-stunts-r23-game.js &&
               grep -q 'capture listener here used to disable' /tmp/road-stunts-r23-map-ui.js &&
               grep -q 'mapWheelZoomFactor' /tmp/road-stunts-r23-unified-map.js &&
               curl --fail --silent --show-error --location "$base/road-surfaces.js" -o /tmp/road-stunts-r23-roads.js &&
               curl --fail --silent --show-error --location "$base/arcade-ramps.js" -o /tmp/road-stunts-r23-ramps.js &&
               grep -q 'harmonizeMergeLanes' /tmp/road-stunts-r23-roads.js &&
               grep -q 'jump-gate-sign' /tmp/road-stunts-r23-ramps.js &&
               curl --fail --silent --show-error --location "$base/road-grade-crossings.js" -o /tmp/r25-crossings.js &&
               grep -q 'localGradeDeck' /tmp/r25-crossings.js &&
               curl --fail --silent --show-error --location "$base/collector-cars.js" -o /tmp/r26-cars.js &&
               grep -q 'COLLECTOR_CHANCE=.015' /tmp/r26-cars.js &&
               curl --fail --silent --show-error --location "$base/compact-hud.css?v=$GITHUB_SHA" -o /tmp/r26-hud.css &&
               cmp dist/compact-hud.css /tmp/r26-hud.css &&
               curl --fail --silent --show-error --location "$base/villa-mandria-v9-estate-life.js?v=$GITHUB_SHA" -o /tmp/r26-delivery.js &&
               cmp dist/villa-mandria-v9-estate-life.js /tmp/r26-delivery.js; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Playtest link
        run: echo 'https://dreamer-archalo.github.io/padova-open-world/preview/solo-cars-r26/'
