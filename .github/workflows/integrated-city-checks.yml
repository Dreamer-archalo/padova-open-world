name: Integrated Mandria and city acceptance
on:
  push:
    branches: [fix/integrated-mandria-continuity-20260921, fix/shared-street-surface-20260922]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover regional map for integrated checks
        shell: bash
        run: |
          set -euo pipefail
          for name in venice.json region-padova-venice.json world-padova-venice.json world-terrain.json; do
            curl --fail --silent --show-error --location --max-time 60 "https://dreamer-archalo.github.io/padova-open-world/preview/solo-cars-r26/data/$name" -o "dist/data/$name"
          done
      - name: Continuity, villa v11, catalogue and preserved game systems
        run: |
          node tools/verify-shared-streets.mjs
          node verify-elevation-harmony.mjs
          npm run test:city-continuity
          npm run test:earth-access
          node tools/verify-villa-mandria-relocation.mjs
          node tools/verify-mandria-catalog-ui.mjs
          node tools/verify-villa-mandria-life.mjs
          node tools/verify-villa-mandria-estate-v2.mjs
          node tools/verify-mandria-v5-private-road.mjs
          node tools/verify-mandria-v5.mjs
          node tools/verify-mandria-v11-roads.mjs
          node tools/verify-airport-military-fleet.mjs
          node tools/verify-air-hunt.mjs
          npm run test:taxi
          npm run test:tangenziale-race
          node tools/verify-race-one-r27.mjs
          npm run test:race-immersion
          npm run test:race-two
          node verify-online-race.mjs
          node verify-online-race-second-fix.mjs
          node --max-old-space-size=3072 verify-streaming.mjs
          npm run test:initial-world
          node verify-feature-preservation.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        test: [race-two-r30-browser, race-immersion-r28-browser, shared-streets-browser, mandria-estate-v2-chromium, mandria-estate-v3-chromium, mandria-v5-chromium, mandria-v5-estate-chromium, mandria-v6-browser, mandria-v7-browser, mandria-v8-browser, mandria-v11-browser, mandria-hangar-chromium, airport-military-fleet-chromium, air-hunt-chromium, monoblocco-chromium]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover regional map for integrated checks
        shell: bash
        run: |
          set -euo pipefail
          for name in venice.json region-padova-venice.json world-padova-venice.json world-terrain.json; do
            curl --fail --silent --show-error --location --max-time 60 "https://dreamer-archalo.github.io/padova-open-world/preview/solo-cars-r26/data/$name" -o "dist/data/$name"
          done
      - name: Install software WebGL browser
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Start game server
        run: |
          node tools/serve.mjs --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:4173/ -o /dev/null; then exit 0; fi; sleep 1; done
          exit 1
      - name: Exercise actual integrated runtime
        run: node tools/test-${{ matrix.test }}.mjs
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-${{ matrix.test }}
          path: test-artifacts/
          if-no-files-found: ignore
