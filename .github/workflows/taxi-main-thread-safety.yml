name: Taxi main-thread safety
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and actual runtime taxi integration
        run: |
          node --check dist/TaxiDispatcher.js
          node --check dist/taxi-confirmation-runtime.js
          node verify-taxi-main-thread-safety.mjs
          node verify-taxi-transfer-pause.mjs
          node verify-taxi-confirmation-runtime.mjs
          npm run test:taxi
          node verify-taxi-transition-recovery.mjs
      - name: Real Padova taxi destination stress test
        run: node --max-old-space-size=3072 tools/diagnose-taxi-real-map.mjs
      - name: Startup, races and online regression
        run: |
          npm run test:initial-world
          node verify-geometry-integrity.mjs
          npm run test:tangenziale-race
          node verify-online-race.mjs
          node verify-online-race-second-fix.mjs
