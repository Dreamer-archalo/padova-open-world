name: Publish PR 51 preview to GitHub Pages

on:
  push:
    branches:
      - feat/villa-treves-phase1-20260919
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Share the production deployment queue; never race the main Pages workflow.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/pr-51/
    steps:
      - name: Checkout published production sources without modifications
        uses: actions/checkout@v6
        with:
          ref: main
          path: production
          persist-credentials: false
      - name: Checkout PR 51 preview, without merging into main
        uses: actions/checkout@v6
        with:
          ref: feat/villa-treves-phase1-20260919
          path: preview
          persist-credentials: false
      - name: Validate isolated preview files
        shell: bash
        run: |
          set -euo pipefail
          test -f production/dist/index.html
          test -f preview/dist/index.html
          test -f preview/dist/villa-mandria-catalog-ui.js
          test -f preview/dist/villa-mandria-hangar.js
          test -f preview/dist/villa-mandria-relocation.js
          node --check preview/dist/villa-mandria-catalog-ui.js
          node --check preview/dist/villa-mandria-hangar.js
          node --check preview/dist/phase2-runtime.js
          node preview/tools/verify-mandria-catalog-ui.mjs
      - name: Assemble stable production and separate versioned preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/preview/pr-51
          cp -a production/dist/. site/
          cp -a preview/dist/. site/preview/pr-51/
          touch site/.nojekyll
          cmp production/dist/index.html site/index.html
          cmp preview/dist/index.html site/preview/pr-51/index.html
          test -f site/preview/pr-51/data/padova.json
          test -f site/preview/pr-51/vendor/three.module.js
          echo "Production root matches main; PR game exists only under /preview/pr-51/."
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload stable game plus PR preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Print preview URL
        run: echo "Preview ${{ steps.deployment.outputs.page_url }}preview/pr-51/"
