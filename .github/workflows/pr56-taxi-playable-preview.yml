name: PR56 taxi and street playable preview (main preserved)

on:
  push:
    branches: [fix/shared-street-surface-20260922]
    paths:
      - '.github/workflows/pr56-taxi-playable-preview.yml'
      - 'dist/taxi-service.js'
      - 'dist/Pathfinder.js'
      - 'tools/diagnose-taxi-real-map.mjs'
      - 'dist/street-height-field.js'
      - 'dist/terrain.js'
      - 'dist/road-surfaces.js'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pr56-taxi-playable-preview
  cancel-in-progress: true

jobs:
  verify-and-deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - name: Checkout exact unmerged PR56 candidate
        uses: actions/checkout@v6
        with:
          ref: fix/shared-street-surface-20260922
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm taxi implementation and destination latency on the real map
        run: |
          set -euo pipefail
          node --check dist/taxi-service.js
          node --check dist/Pathfinder.js
          node tools/diagnose-taxi-real-map.mjs
          npm run test:taxi
          node verify-taxi-main-thread-safety.mjs
          node verify-taxi-transfer-pause.mjs
          node verify-taxi-confirmation-runtime.mjs
          node verify-taxi-transition-recovery.mjs
      - name: Verify shared-road geometry retained in preview
        run: |
          set -euo pipefail
          node tools/verify-shared-streets.mjs
          node verify-elevation-harmony.mjs
          test -f dist/index.html
          test -f dist/data/padova.json
          test -f dist/vendor/three.module.js
      - name: Checkout CURRENT official main separately (do not alter its game files)
        uses: actions/checkout@v6
        with:
          ref: main
          path: .production-source
          persist-credentials: false
      - name: Preserve production and add ONLY isolated PR56 folder
        shell: bash
        run: |
          set -euo pipefail
          test -f .production-source/dist/index.html
          test -f .production-source/dist/version.json
          test -f dist/taxi-service.js
          sha256sum .production-source/dist/index.html .production-source/dist/game.js .production-source/dist/version.json > /tmp/pr56-production-root.sha
          mkdir -p .production-source/dist/preview/pr-56
          cp -a dist/. .production-source/dist/preview/pr-56/
          cmp dist/taxi-service.js .production-source/dist/preview/pr-56/taxi-service.js
          cmp dist/Pathfinder.js .production-source/dist/preview/pr-56/Pathfinder.js
          test -f .production-source/dist/preview/pr-56/data/padova.json
          test -f .production-source/dist/preview/pr-56/vendor/three.module.js
          sha256sum -c /tmp/pr56-production-root.sha
          touch .production-source/dist/.nojekyll
      - name: Checkout historic Villa PR51 preview source
        uses: actions/checkout@v6
        with:
          ref: feat/villa-treves-phase1-20260919
          path: .historic-pr51
          persist-credentials: false
      - name: Checkout historic PR52 preview source
        uses: actions/checkout@v6
        with:
          ref: 20c6411c215ad57bdc1a57df0f0ae69554d241c2
          path: .historic-pr52
          persist-credentials: false
      - name: Checkout original Villa v11 preview source
        uses: actions/checkout@v6
        with:
          ref: cb6d5fb1f3afedfda68f8f07651916d3a8e12f28
          path: .historic-v11
          persist-credentials: false
      - name: Preserve all previously published test links
        shell: bash
        run: |
          set -euo pipefail
          for item in 'pr-51 .historic-pr51' 'pr-52 .historic-pr52' 'mandria-v11 .historic-v11'; do
            read -r name folder <<< "$item"
            test -f "$folder/dist/index.html"
            mkdir -p ".production-source/dist/preview/$name"
            cp -a "$folder/dist/." ".production-source/dist/preview/$name/"
            cmp "$folder/dist/index.html" ".production-source/dist/preview/$name/index.html"
          done
          sha256sum -c /tmp/pr56-production-root.sha
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload unchanged main plus isolated previews
        uses: actions/upload-pages-artifact@v4
        with:
          path: .production-source/dist
      - name: Publish preview to GitHub Pages without merge
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Display exact PR56 playtest URL
        run: |
          echo 'https://dreamer-archalo.github.io/padova-open-world/preview/pr-56/'
          echo "Pages: ${{ steps.deployment.outputs.page_url }}"
