name: Padova Venice unified main-game preview

on:
  push:
    branches: [feat/unified-main-world-20260925]
    paths:
      - 'dist/game.js'
      - 'dist/index.html'
      - 'dist/unified-main.css'
      - 'dist/unified-map.js'
      - 'dist/unified-regions.js'
      - 'dist/regional-world.js'
      - 'dist/modern-driving.js'
      - 'verify-unified-main.mjs'
      - 'scripts/padova-venice-buildings-overpass.ql'
      - 'scripts/padova-venice-local-streets-overpass.ql'
      - 'dist/continuous-world.html'
      - 'dist/continuous-world.css'
      - 'dist/continuous-world.js'
      - 'dist/continuous-world-venice-entry.js'
      - 'dist/venice-map-entry.js'
      - 'dist/venice.html'
      - 'prepare_corridor.py'
      - 'prepare_world_map.py'
      - 'prepare_world_terrain.py'
      - 'scripts/padova-venice-corridor-overpass.ql'
      - 'verify-continuous-world.mjs'
      - '.github/workflows/unified-main-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: padova-venice-unified-main-preview
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout unified main-world candidate
        uses: actions/checkout@v6
        with:
          ref: feat/unified-main-world-20260925

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install terrain generator dependencies
        run: python -m pip install --disable-pip-version-check --quiet pillow numpy scipy

      - name: Cache mapped source extracts and DEM tiles
        uses: actions/cache@v4
        with:
          path: |
            /tmp/corridor-overpass.json
            /tmp/corridor-buildings.json
            /tmp/corridor-local-streets.json
            /tmp/padova-venice-terrain
          key: regional-data-v1-${{ hashFiles('scripts/padova-venice-corridor-overpass.ql', 'scripts/padova-venice-buildings-overpass.ql', 'scripts/padova-venice-local-streets-overpass.ql', 'prepare_world_terrain.py') }}

      - name: Download OpenStreetMap extracts
        shell: bash
        run: |
          set -euo pipefail
          fetch_query () {
            local query="$1" out="$2"
            fetch_one () {
              local endpoint="$1"
              echo "Trying $endpoint for $query"
              curl --fail --show-error --silent --location --retry 1 --retry-delay 4 --max-time 90 \
                -A 'PadovaOpenWorld-ContinuousPreview/1.0' \
                --data-urlencode "data@$query" "$endpoint" -o "$out"
              python -c 'import json,sys; p=sys.argv[1]; d=json.load(open(p)); assert len(d.get("elements",[]))>200, "OSM response unexpectedly small"; print(p,"elements:",len(d["elements"]))' "$out"
            }
            if test -s "$out" && python -c 'import json,sys; assert len(json.load(open(sys.argv[1])).get("elements",[]))>200' "$out"; then
              echo "Using cached OSM extract: $out"
              return 0
            fi
            fetch_one "https://overpass.private.coffee/api/interpreter" \
              || fetch_one "https://maps.mail.ru/osm/tools/overpass/api/interpreter" \
              || fetch_one "https://overpass-api.de/api/interpreter"
          }
          mkdir -p dist/data
          if ! curl --fail --show-error --silent --location --max-time 45             https://dreamer-archalo.github.io/padova-open-world/preview/venice/data/venice.json             -o dist/data/venice.json; then
            fetch_query scripts/venice-overpass.ql /tmp/venice-overpass.json
            python prepare_venice.py /tmp/venice-overpass.json
          fi
          python -c 'import json; d=json.load(open("dist/data/venice.json")); assert len(d.get("buildings",[]))>2500'
          fetch_query scripts/padova-venice-corridor-overpass.ql /tmp/corridor-overpass.json
          fetch_query scripts/padova-venice-buildings-overpass.ql /tmp/corridor-buildings.json
          fetch_query scripts/padova-venice-local-streets-overpass.ql /tmp/corridor-local-streets.json

      - name: Build unified world data
        run: |
          set -euo pipefail
          python prepare_corridor.py /tmp/corridor-overpass.json /tmp/corridor-buildings.json /tmp/corridor-local-streets.json
          python prepare_world_terrain.py --cache /tmp/padova-venice-terrain
          python prepare_world_map.py
          test -s dist/data/world-padova-venice.json
          test -s dist/data/world-terrain.json
          test -s dist/data/region-padova-venice.json

      - name: Verify continuous world
        run: |
          set -euo pipefail
          node --check dist/continuous-world.js
          node --check dist/venice-map-entry.js
          node --check dist/continuous-world-venice-entry.js
          node verify-continuous-world.mjs
          node --check dist/game.js
          node --check dist/unified-map.js
          node --check dist/unified-regions.js
          node --check dist/regional-world.js
          node verify-unified-main.mjs

      - name: Checkout current production main separately
        uses: actions/checkout@v6
        with:
          ref: main
          path: .production-source
          persist-credentials: false

      - name: Install isolated unified preview without modifying production
        shell: bash
        run: |
          set -euo pipefail
          test -f .production-source/dist/index.html
          sha256sum .production-source/dist/index.html .production-source/dist/game.js > /tmp/production-root.sha
          mkdir -p .production-source/dist/preview/unified
          cp -a dist/. .production-source/dist/preview/unified/
          test -s .production-source/dist/preview/unified/data/region-padova-venice.json
          test -s .production-source/dist/preview/unified/game.js
          sha256sum -c /tmp/production-root.sha

      - name: Checkout previous continuous prototype
        uses: actions/checkout@v6
        with:
          ref: feat/padova-venice-continuous-20260925
          path: .prior-continuous
          persist-credentials: false

      - name: Checkout previous standalone Venice
        uses: actions/checkout@v6
        with:
          ref: feat/venice-world-20260924
          path: .prior-venice
          persist-credentials: false

      - name: Preserve previous continuous and Venice previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .production-source/dist/preview/continuous .production-source/dist/preview/venice
          cp -a .prior-continuous/dist/. .production-source/dist/preview/continuous/
          cp -a .prior-venice/dist/. .production-source/dist/preview/venice/
          cp dist/data/world-padova-venice.json dist/data/world-terrain.json dist/data/venice.json .production-source/dist/preview/continuous/data/
          cp dist/data/venice.json .production-source/dist/preview/venice/data/
          test -s .production-source/dist/preview/continuous/data/world-padova-venice.json
          test -s .production-source/dist/preview/venice/data/venice.json
          sha256sum -c /tmp/production-root.sha

      - name: Preserve PR57 preview
        uses: actions/checkout@v6
        with:
          ref: feat/monoblocco-elevators-20260924
          path: .pr57
          persist-credentials: false

      - name: Preserve PR56 preview
        uses: actions/checkout@v6
        with:
          ref: fix/shared-street-surface-20260922
          path: .pr56
          persist-credentials: false

      - name: Preserve PR51 preview
        uses: actions/checkout@v6
        with:
          ref: feat/villa-treves-phase1-20260919
          path: .pr51
          persist-credentials: false

      - name: Preserve PR52 preview
        uses: actions/checkout@v6
        with:
          ref: 20c6411c215ad57bdc1a57df0f0ae69554d241c2
          path: .pr52
          persist-credentials: false

      - name: Preserve Mandria v11 preview
        uses: actions/checkout@v6
        with:
          ref: cb6d5fb1f3afedfda68f8f07651916d3a8e12f28
          path: .mandria-v11
          persist-credentials: false

      - name: Rebuild known legacy previews
        shell: bash
        run: |
          set -euo pipefail
          for item in "pr-57 .pr57" "pr-56 .pr56" "pr-51 .pr51" "pr-52 .pr52" "mandria-v11 .mandria-v11"; do
            read -r name folder <<< "$item"
            test -f "$folder/dist/index.html"
            mkdir -p ".production-source/dist/preview/$name"
            cp -a "$folder/dist/." ".production-source/dist/preview/$name/"
          done
          touch .production-source/dist/.nojekyll
          sha256sum -c /tmp/production-root.sha

      - uses: actions/configure-pages@v5
      - name: Upload production plus isolated previews
        uses: actions/upload-pages-artifact@v4
        with:
          path: .production-source/dist
      - name: Publish main-game unified preview without merging
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Display playtest URL
        run: |
          echo 'Unified main game: https://dreamer-archalo.github.io/padova-open-world/preview/unified/'
          echo 'Earlier continuous prototype: https://dreamer-archalo.github.io/padova-open-world/preview/continuous/continuous-world.html'
          echo 'Standalone Venice: https://dreamer-archalo.github.io/padova-open-world/preview/venice/venice.html'
