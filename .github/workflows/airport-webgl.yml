name: Airport WebGL browser trial
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/**'
      - 'tools/test-airport-chromium.mjs'
      - '.github/workflows/airport-webgl.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  airport-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary Playwright and Chromium
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Drive across airport gate in real WebGL Chromium
        run: |
          node tools/serve.mjs --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 25); do if curl -fsS http://127.0.0.1:4173/ -o /dev/null; then break; fi; sleep 1; done
          node tools/test-airport-chromium.mjs
      - name: Upload real browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airport-webgl-evidence
          path: test-artifacts/
          if-no-files-found: ignore
