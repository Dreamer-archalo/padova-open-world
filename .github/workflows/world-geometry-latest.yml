name: World geometry latest validation

on:
  push:
    branches: [work/world-geometry-overhaul-latest]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core regression suite
            command: npm test
          - name: Modern world suite
            command: npm run test:modern
          - name: Surface layer audit
            command: npm run audit:surfaces
          - name: Terrain polish
            command: npm run test:terrain-polish
          - name: Elevation harmony
            command: node tools/diagnose-elevation-shoulders.mjs && npm run test:elevation-harmony
          - name: Geometry integrity
            command: npm run test:geometry-integrity
          - name: Initial world loading
            command: npm run test:initial-world
          - name: Streaming regression
            command: npm run test:streaming
          - name: Taxi regression
            command: npm run test:taxi
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
