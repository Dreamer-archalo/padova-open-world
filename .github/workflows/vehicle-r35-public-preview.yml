name: Vehicle R35 coachwork playtest

on:
  push:
    branches: [feat/vehicle-finish-r35]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recover regional data for the playtest
        shell: bash
        run: |
          set -euo pipefail
          for name in venice.json region-padova-venice.json world-padova-venice.json world-terrain.json map-hd-extras.json; do
            found=false
            for label in solo-cars-r26 road-fixes-r25 taxi-r22 road-levels-r21 padova-npc-r17 dealerships unified; do
              url="https://dreamer-archalo.github.io/padova-open-world/preview/$label/data/$name"
              if curl --fail --silent --show-error --location --max-time 60 "$url" -o "dist/data/$name"; then
                echo "Recovered $name from $label"
                found=true
                break
              fi
            done
            if test "$found" != true && test "$name" != map-hd-extras.json; then
              echo "Missing required regional file: $name" >&2
              exit 1
            fi
          done
          for name in venice.json region-padova-venice.json world-padova-venice.json world-terrain.json; do test -s "dist/data/$name"; done

      - name: Verify R35 vehicle update
        run: |
          node --check dist/modern-vehicles.js
          node --check dist/world.js
          node --check dist/villa-mandria-hangar.js
          node tools/verify-vehicle-silhouettes-r33.mjs
          node tools/verify-vehicle-finish-r35.mjs
          npm run test:npc-traffic
          npm run test:performance
          node verify-collector-cars-r26.mjs
          node verify-dealerships.mjs
          node tools/verify-mandria-hangar.mjs

      - name: Chromium visual review
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
          node tools/test-vehicle-finish-r35-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vehicle-r35-visual-review
          path: test-artifacts/r35
      - name: Download currently published Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=github-pages&per_page=100" --jq '[.artifacts[] | select(.expired==false)][0].workflow_run.id')"
          test -n "$RUN_ID"
          mkdir -p /tmp/current-pages site
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name github-pages --dir /tmp/current-pages
          ARCHIVE="$(find /tmp/current-pages -type f -name '*.tar' | head -n 1)"
          test -n "$ARCHIVE"
          tar -xf "$ARCHIVE" -C site
          test -f site/index.html

      - name: Add isolated R35 preview without changing production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/preview/vehicles-r35
          rm -rf site/preview/vehicles-r35/*
          cp -a dist/. site/preview/vehicles-r35/
          touch site/.nojekyll
          test -f site/preview/vehicles-r35/index.html
          test -s site/preview/vehicles-r35/data/region-padova-venice.json
          test -s site/preview/vehicles-r35/data/world-terrain.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy isolated public preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public R35 link
        shell: bash
        run: |
          set -euo pipefail
          base='https://dreamer-archalo.github.io/padova-open-world/preview/vehicles-r35'
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location "$base/index.html" -o /tmp/r35.html &&
               curl --fail --silent --show-error --location "$base/modern-vehicles.js" -o /tmp/r35-vehicles.js &&
               grep -q 'createCoachwork' /tmp/r35-vehicles.js &&
               grep -q 'Targa Aperta' /tmp/r35-vehicles.js; then
              exit 0
            fi
            sleep 5
          done
          exit 1
