name: Piova R33 preview and regressions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/piova-r33-preview.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: e7fb6674f6c08ce7b17afd7e4c190c8328396524
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download the latest successful published Pages artifact
        id: published
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRunsForRepo({...context.repo, status:'success', per_page:100});
            for (const run of runs.data.workflow_runs) {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id:run.id});
              const artifact = artifacts.data.artifacts.find(a => a.name==='github-pages' && !a.expired);
              if (!artifact) continue;
              core.setOutput('run', String(run.id));
              core.info(`Preserving deployed Pages from successful run ${run.id}`);
              return;
            }
            core.setFailed('No complete published Pages artifact available; refusing to replace production.');
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ steps.published.outputs.run }}
          github-token: ${{ github.token }}
          path: .published-archive
      - name: Recover exact published world and regional data
        run: |
          set -euo pipefail
          mkdir .published
          tar -xf .published-archive/artifact.tar -C .published
          test -s .published/index.html
          test -s .published/game.js
          for name in venice.json region-padova-venice.json world-padova-venice.json world-terrain.json; do
            cp ".published/data/$name" "dist/data/$name"
          done
      - name: Verify spawn, movement, impact and world regressions
        run: |
          set -euo pipefail
          npm run test:npc-traffic
          npm run test:biker-club
          npm run test:boats-collisions
          npm run test:phase3-runtime
          npm run test:multilane
          npm run test:urban-life
          node verify-padova-intelligent-npc-r17.mjs
          node verify-regional-npc-r14.mjs
          npm run test:vehicle-damage
          npm run test:jumps
          npm run test:race-immersion
          npm run test:race-two
          npm run test:taxi
          npm run test:city-continuity
          node verify-feature-preservation.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Real browser input and WebGL verification
        run: |
          node tools/test-npc-traffic-r31-browser.mjs
          node tools/test-biker-club-browser.mjs
          npm run test:boats-hangar-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npc-traffic-r31-tests
          path: |
            test-artifacts/r31
            test-artifacts/r32
            test-artifacts/r33
          if-no-files-found: ignore
      - name: Add only the isolated Piova R33 preview
        run: |
          set -euo pipefail
          find .published -type f ! -path '.published/preview/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/r31-production.sha
          mkdir -p .published/preview/npc-traffic-r31
          rsync -a --exclude=preview dist/ .published/preview/npc-traffic-r31/
          sha256sum -c /tmp/r31-production.sha > /dev/null
          touch .published/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .published
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify public preview matches tested source
        run: |
          set -euo pipefail
          base='https://dreamer-archalo.github.io/padova-open-world/preview/npc-traffic-r31'
          for name in index.html game.js npc-spawn-policy.js stunt-traffic.js flight-exit.js special-vehicles.js traffic.js boat-models.js nautical-catalog.js vehicle-contact.js vehicle-dynamics.js villa-mandria-catalog-ui.js villa-mandria-hangar.js biker-club.js; do
            curl --retry 5 --retry-delay 5 --fail --silent --show-error --location "$base/$name?v=$GITHUB_SHA" -o /tmp/r31-verified-file
            cmp "dist/$name" /tmp/r31-verified-file
          done
