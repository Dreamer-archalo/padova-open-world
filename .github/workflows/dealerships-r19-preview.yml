name: Dealerships in mapped buildings R19 preview

on:
  push:
    branches: [feat/dealerships-building-r19]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Try published regional map data
        id: regional
        run: |
          set -euo pipefail
          for name in venice.json region-padova-venice.json world-padova-venice.json world-terrain.json map-hd-extras.json; do
            if ! curl --fail --silent --location --max-time 45 \
              "https://dreamer-archalo.github.io/padova-open-world/preview/unified/data/$name" -o "dist/data/$name"; then
              echo 'fallback=true' >> "$GITHUB_OUTPUT"
              break
            fi
          done
      - uses: actions/download-artifact@v4
        if: steps.regional.outputs.fallback == 'true'
        with:
          name: github-pages
          run-id: 36983088702
          github-token: ${{ github.token }}
          path: .previous-pages
      - name: Recover regional data and check mapped showrooms
        run: |
          set -euo pipefail
          if test -f .previous-pages/artifact.tar; then
            tar -xf .previous-pages/artifact.tar -C .previous-pages
            for name in venice.json region-padova-venice.json world-padova-venice.json world-terrain.json map-hd-extras.json; do
              if test -s ".previous-pages/preview/unified/data/$name"; then
                cp ".previous-pages/preview/unified/data/$name" "dist/data/$name"
              elif test -s ".previous-pages/preview/padova-npc-r17/data/$name"; then
                cp ".previous-pages/preview/padova-npc-r17/data/$name" "dist/data/$name"
              fi
            done
          fi
          for name in venice.json region-padova-venice.json world-padova-venice.json world-terrain.json; do
            test -s "dist/data/$name"
          done
          node -e "for(const n of ['region-padova-venice','world-padova-venice','world-terrain','venice']){const d=require('./dist/data/'+n+'.json'); if(!d||typeof d!=='object')process.exit(1)}"
          node verify-dealerships-regional.mjs
      - name: Verify changed features
        run: |
          set -euo pipefail
          npm run test:taxi
          node verify-dealerships.mjs
          node verify-taxi-wallet.mjs
          node verify-hangar-air.mjs
          node tools/verify-mandria-hangar.mjs
          node tools/verify-taxi-hotfix.mjs
          node verify-padova-intelligent-npc-r17.mjs
          npm run test
          npm run test:city-life
          npm run test:urban-life
          npm run test:street-life
          npm run test:performance
          npm run test:venice-performance
          npm run test:initial-world
          npm run test:phase3-city
      - uses: actions/checkout@v6
        with:
          ref: feat/padova-intelligent-npc-r17
          path: .prior-padova-r17
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: feat/dealerships-urban-showrooms
          path: .prior-dealerships
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: main
          path: .production-source
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: fix/regional-taxi-20260928
          path: .prior-unified
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: feat/padova-venice-continuous-20260925
          path: .prior-continuous
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: feat/venice-world-20260924
          path: .prior-venice
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: feat/monoblocco-elevators-20260924
          path: .pr57
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: fix/shared-street-surface-20260922
          path: .pr56
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: feat/villa-treves-phase1-20260919
          path: .pr51
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 20c6411c215ad57bdc1a57df0f0ae69554d241c2
          path: .pr52
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: cb6d5fb1f3afedfda68f8f07651916d3a8e12f28
          path: .mandria-v11
          persist-credentials: false
      - name: Assemble isolated previews and retain production
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .production-source/dist/index.html .production-source/dist/game.js > /tmp/production-root.sha
          for item in 'dealerships-r19 .' 'padova-npc-r17 .prior-padova-r17' 'dealerships .prior-dealerships' 'unified .prior-unified' 'continuous .prior-continuous' 'venice .prior-venice' 'pr-57 .pr57' 'pr-56 .pr56' 'pr-51 .pr51' 'pr-52 .pr52' 'mandria-v11 .mandria-v11'; do
            read -r label source <<< "$item"
            mkdir -p ".production-source/dist/preview/$label"
            cp -a "$source/dist/." ".production-source/dist/preview/$label/"
          done
          for label in unified continuous venice; do
            cp dist/data/venice.json dist/data/world-padova-venice.json dist/data/world-terrain.json ".production-source/dist/preview/$label/data/"
          done
          cp dist/data/region-padova-venice.json .production-source/dist/preview/unified/data/
          cp dist/data/region-padova-venice.json dist/data/world-terrain.json .production-source/dist/preview/padova-npc-r17/data/
          touch .production-source/dist/.nojekyll
          test -s .production-source/dist/preview/dealerships-r19/data/region-padova-venice.json
          grep -q 'game.js?v=dealerships-r19' .production-source/dist/preview/dealerships-r19/index.html
          sha256sum -c /tmp/production-root.sha
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .production-source/dist
      - uses: actions/deploy-pages@v4
      - name: Verify the public R19 preview
        run: |
          set -euo pipefail
          base='https://dreamer-archalo.github.io/padova-open-world/preview/dealerships-r19'
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location "$base/index.html" -o /tmp/dealer-preview.html &&
               curl --fail --silent --show-error --location "$base/game.js" -o /tmp/dealer-preview-game.js &&
               grep -q 'game.js?v=dealerships-r19' /tmp/dealer-preview.html &&
               grep -q 'function dealerMenu' /tmp/dealer-preview-game.js; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Playtest link
        run: echo 'https://dreamer-archalo.github.io/padova-open-world/preview/dealerships-r19/'
