name: Deploy Padova Open World to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Apply unified taxi menu refactor
        run: |
          python3 scripts/fix-taxi-runtime.py
          node --check dist/game.js
          node --check dist/core.js
          node --check dist/taxi-service.js
          node --check dist/taxi-map-ui.js
          node --check dist/InputManager.js
          node --check dist/TaxiDispatcher.js
          node --check dist/TaxiLoadingOverlay.js
          node --check dist/TaxiDriverNPC.js
          node --check dist/Pathfinder.js
          node --check dist/TaxiSystem.js
          node --check dist/TaxiMenuController.js
      - name: Persist unified taxi menu runtime in main
        run: |
          if ! git diff --quiet -- dist; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist
            git commit -m "Persist non-blocking taxi menu integration [skip ci]"
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dist
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
