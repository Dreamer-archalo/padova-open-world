name: Deploy Padova Open World to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: >
    ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Preview only:') && 'preview-config-only' || 'pages' }}
  cancel-in-progress: false

jobs:
  verify-integrated-game:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Preview only:') }}
    uses: ./.github/workflows/integrated-city-checks.yml
  deploy:
    needs: verify-integrated-game
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover regional map for the definitive game
        shell: bash
        run: |
          set -euo pipefail
          for name in venice.json region-padova-venice.json world-padova-venice.json world-terrain.json map-hd-extras.json; do
            found=false
            for label in solo-cars-r26 road-fixes-r25 taxi-r22 road-levels-r21 padova-npc-r17 dealerships unified; do
              url="https://dreamer-archalo.github.io/padova-open-world/preview/$label/data/$name"
              if curl --fail --silent --show-error --location --max-time 45 "$url" -o "dist/data/$name"; then
                echo "Recovered $name from $label"
                found=true
                break
              fi
            done
            if test "$found" != true && test "$name" != map-hd-extras.json; then
              echo "Missing required regional file: $name" >&2
              exit 1
            fi
          done
          for name in venice.json region-padova-venice.json world-padova-venice.json world-terrain.json; do
            test -s "dist/data/$name"
          done
      - name: Validate production runtime
        run: |
          test -f dist/index.html
          node --input-type=module -e "import fs from 'node:fs'; const v=JSON.parse(fs.readFileSync('dist/version.json')); if(v.version!=='1.2.1' || v.publishDirectory!=='dist' || v.officialSite!=='https://dreamer-archalo.github.io/padova-open-world/') process.exit(1);"
          node --check dist/game.js
          node --check dist/city-micromobility.js
          node --check dist/phase2-runtime.js
          node --check dist/core.js
          node --check dist/taxi-service.js
          node --check dist/taxi-map-ui.js
          node --check dist/InputManager.js
          node --check dist/TaxiDispatcher.js
          node --check dist/TaxiLoadingOverlay.js
          node --check dist/TaxiDriverNPC.js
          node --check dist/Pathfinder.js
          node --check dist/TaxiSystem.js
          node --check dist/TaxiMenuController.js
          node --check dist/road-reality-pass.js
          node --check dist/road-reality-audit.js
          node --check dist/tangenziale-race.js
          node --check dist/tangenziale-race-polish.js
          node --check dist/tangenziale-race-short-sprint.js
          node --check dist/online-race-v2.js
          node --check dist/online-race-second-fix.js
          node --check dist/villa-mandria-v11-road-quality.js
          node --check dist/villa-mandria-v11-estate-polish.js
      - name: Release smoke tests before publishing
        run: |
          npm run test:taxi
          npm run test:tangenziale-race
          node verify-online-race.mjs
          node verify-online-race-second-fix.mjs
          npm run test:initial-world
          node verify-geometry-integrity.mjs
          npm run test:portello
          node verify-city-micromobility.mjs
          node verify-feature-preservation.mjs
          node tools/verify-mandria-v11-roads.mjs
      - name: Full elevation audit — mandatory continuous street geometry
        run: npm run test:geometry-integrity
      - name: Checkout historic PR 51 playtest separately
        uses: actions/checkout@v6
        with:
          ref: feat/villa-treves-phase1-20260919
          path: .preview-pr51-source
          persist-credentials: false
      - name: Preserve historic PR 51 preview without overwriting production
        shell: bash
        run: |
          set -euo pipefail
          test -f .preview-pr51-source/dist/index.html
          test -f .preview-pr51-source/dist/villa-mandria-catalog-ui.js
          test -f .preview-pr51-source/dist/villa-mandria-hangar.js
          test -f .preview-pr51-source/dist/villa-mandria-relocation.js
          test -f .preview-pr51-source/dist/villa-mandria-life.js
          node --check .preview-pr51-source/dist/villa-mandria-catalog-ui.js
          node --check .preview-pr51-source/dist/villa-mandria-hangar.js
          node --check .preview-pr51-source/dist/villa-mandria-life.js
          node .preview-pr51-source/tools/verify-mandria-catalog-ui.mjs
          node .preview-pr51-source/tools/verify-villa-mandria-life.mjs
          mkdir -p dist/preview/pr-51
          cp -a .preview-pr51-source/dist/. dist/preview/pr-51/
          touch dist/.nojekyll
          cmp .preview-pr51-source/dist/index.html dist/preview/pr-51/index.html
          test -f dist/preview/pr-51/data/padova.json
          test -f dist/preview/pr-51/vendor/three.module.js
      - name: Checkout historic PR 52 continuity playtest separately
        uses: actions/checkout@v6
        with:
          ref: 20c6411c215ad57bdc1a57df0f0ae69554d241c2
          path: .preview-pr52-source
          persist-credentials: false
      - name: Preserve historic PR 52 preview without overwriting production
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix .preview-pr52-source run test:city-continuity
          npm --prefix .preview-pr52-source run test:earth-access
          mkdir -p dist/preview/pr-52
          cp -a .preview-pr52-source/dist/. dist/preview/pr-52/
          cmp .preview-pr52-source/dist/index.html dist/preview/pr-52/index.html
          test -f dist/preview/pr-52/earth-access.js
          test -f dist/preview/pr-52/data/padova.json
          test -f dist/preview/pr-52/vendor/three.module.js
          git diff --exit-code -- dist
      - name: Checkout original Mandria v11 playtest separately
        uses: actions/checkout@v6
        with:
          ref: cb6d5fb1f3afedfda68f8f07651916d3a8e12f28
          path: .preview-mandria-v11-source
          persist-credentials: false
      - name: Preserve original Mandria v11 preview
        shell: bash
        run: |
          set -euo pipefail
          test -f .preview-mandria-v11-source/dist/index.html
          test -f .preview-mandria-v11-source/dist/villa-mandria-v11-estate-polish.js
          mkdir -p dist/preview/mandria-v11
          cp -a .preview-mandria-v11-source/dist/. dist/preview/mandria-v11/
          cmp .preview-mandria-v11-source/dist/index.html dist/preview/mandria-v11/index.html
          test -f dist/preview/mandria-v11/data/padova.json
          test -f dist/preview/mandria-v11/vendor/three.module.js
          git diff --exit-code -- dist
      - name: Preserve the PR56 test link with the same verified game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pr56-current" dist/preview/pr-56
          git archive HEAD dist | tar -x -C "${RUNNER_TEMP}/pr56-current"
          cp -a "${RUNNER_TEMP}/pr56-current/dist/." dist/preview/pr-56/
          cmp dist/game.js dist/preview/pr-56/game.js
          cmp dist/street-height-field.js dist/preview/pr-56/street-height-field.js
      - name: Preserve validated regional previews
        shell: bash
        run: |
          set -euo pipefail
          for item in 'npc-traffic-r31 feat/npc-traffic-stunts-r31' 'race-two-r30 feat/race-two-advanced-r30' 'race-selection-r29 feat/race-selection-turbo-r29' 'race-one-r27 c28f0244cbeceaf741ab5f8451cbeb4a37b1739b' 'race-immersion-r28 feat/race-immersion-r28' 'solo-cars-r26 08872df934e5118b3efa7b69811de9aa3843925c' 'road-fixes-r25 7ad45f1332c3b95a79518336ddd9a9929d56857d' 'road-stunts-r23 1a053682b054087a4d36638c459b6afc5295f92d' 'taxi-r22 fix/taxi-confirm-map-r22' 'road-levels-r21 feat/padova-road-levels-r21' 'padova-npc-r17 feat/padova-intelligent-npc-r17' 'dealerships feat/dealerships-urban-showrooms' 'unified fix/regional-taxi-20260928' 'continuous feat/padova-venice-continuous-20260925' 'venice feat/venice-world-20260924' 'pr-57 feat/monoblocco-elevators-20260924'; do
            read -r label ref <<< "$item"
            git fetch --no-tags --depth=1 origin "$ref"
            source="${RUNNER_TEMP}/retained-$label"
            mkdir -p "$source" "dist/preview/$label"
            git archive FETCH_HEAD dist | tar -x -C "$source"
            cp -a "$source/dist/." "dist/preview/$label/"
            for name in venice.json region-padova-venice.json world-padova-venice.json world-terrain.json; do
              cp "dist/data/$name" "dist/preview/$label/data/$name"
            done
            if test -s dist/data/map-hd-extras.json; then
              cp dist/data/map-hd-extras.json "dist/preview/$label/data/"
            fi
          done
          git diff --exit-code -- dist/index.html dist/game.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload definitive game plus historic previews
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy definitive version to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Show definitive link
        run: echo "${{ steps.deployment.outputs.page_url }}"
