name: Deploy Padova Open World to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-integrated-game:
    uses: ./.github/workflows/integrated-city-checks.yml
  deploy:
    needs: verify-integrated-game
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate production runtime
        run: |
          test -f dist/index.html
          node --input-type=module -e "import fs from 'node:fs'; const v=JSON.parse(fs.readFileSync('dist/version.json')); if(v.version!=='1.2.0' || v.publishDirectory!=='dist') process.exit(1);"
          node --check dist/game.js
          node --check dist/city-micromobility.js
          node --check dist/phase2-runtime.js
          node --check dist/core.js
          node --check dist/taxi-service.js
          node --check dist/taxi-map-ui.js
          node --check dist/InputManager.js
          node --check dist/TaxiDispatcher.js
          node --check dist/TaxiLoadingOverlay.js
          node --check dist/TaxiDriverNPC.js
          node --check dist/Pathfinder.js
          node --check dist/TaxiSystem.js
          node --check dist/TaxiMenuController.js
          node --check dist/road-reality-pass.js
          node --check dist/road-reality-audit.js
          node --check dist/tangenziale-race.js
          node --check dist/tangenziale-race-polish.js
          node --check dist/tangenziale-race-short-sprint.js
          node --check dist/online-race-v2.js
          node --check dist/online-race-second-fix.js
      - name: Release smoke tests before publishing
        run: |
          npm run test:taxi
          npm run test:tangenziale-race
          node verify-online-race.mjs
          node verify-online-race-second-fix.mjs
          npm run test:initial-world
          node verify-geometry-integrity.mjs
          npm run test:portello
          node verify-city-micromobility.mjs
          node verify-feature-preservation.mjs
      - name: Full elevation audit — pre-existing Bassanello discrepancy, visible and nonblocking
        continue-on-error: true
        run: npm run test:geometry-integrity
      # Keep the production game exactly as checked out from main. The PR game
      # is an independent static build beneath /preview/pr-51/ with its own
      # relative URLs and data files. No PR source is merged into main.
      - name: Checkout unmerged PR 51 for isolated preview
        uses: actions/checkout@v6
        with:
          ref: feat/villa-treves-phase1-20260919
          path: .preview-pr51-source
          persist-credentials: false
      - name: Assemble PR preview without overwriting production files
        shell: bash
        run: |
          set -euo pipefail
          test -f .preview-pr51-source/dist/index.html
          test -f .preview-pr51-source/dist/villa-mandria-catalog-ui.js
          test -f .preview-pr51-source/dist/villa-mandria-hangar.js
          test -f .preview-pr51-source/dist/villa-mandria-relocation.js
          test -f .preview-pr51-source/dist/villa-mandria-life.js
          node --check .preview-pr51-source/dist/villa-mandria-catalog-ui.js
          node --check .preview-pr51-source/dist/villa-mandria-hangar.js
          node --check .preview-pr51-source/dist/villa-mandria-life.js
          node .preview-pr51-source/tools/verify-mandria-catalog-ui.mjs
          node .preview-pr51-source/tools/verify-villa-mandria-life.mjs
          mkdir -p dist/preview/pr-51
          cp -a .preview-pr51-source/dist/. dist/preview/pr-51/
          touch dist/.nojekyll
          cmp .preview-pr51-source/dist/index.html dist/preview/pr-51/index.html
          test -f dist/preview/pr-51/data/padova.json
          test -f dist/preview/pr-51/vendor/three.module.js
          echo 'Main production root untouched; PR 51 game isolated in /preview/pr-51/.'
      # Isolated continuity playtest; never replace the production runtime.
      - name: Checkout PR 52 continuity playtest
        uses: actions/checkout@v6
        with:
          ref: 20c6411c215ad57bdc1a57df0f0ae69554d241c2
          path: .preview-pr52-source
          persist-credentials: false
      - name: Validate and assemble PR 52 playtest
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix .preview-pr52-source run test:city-continuity
          npm --prefix .preview-pr52-source run test:earth-access
          mkdir -p dist/preview/pr-52
          cp -a .preview-pr52-source/dist/. dist/preview/pr-52/
          cmp .preview-pr52-source/dist/index.html dist/preview/pr-52/index.html
          test -f dist/preview/pr-52/earth-access.js
          test -f dist/preview/pr-52/data/padova.json
          test -f dist/preview/pr-52/vendor/three.module.js
          git diff --exit-code -- dist
          echo 'Production files unchanged; continuity playtest isolated in /preview/pr-52/.'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dist plus isolated preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Show public preview link
        run: echo "PR 51 preview ${{ steps.deployment.outputs.page_url }}preview/pr-51/"
      - name: Show continuity playtest link
        run: echo "PR 52 preview ${{ steps.deployment.outputs.page_url }}preview/pr-52/"
