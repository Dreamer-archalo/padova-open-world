name: Mandria villa WebGL and Treves restoration
on:
  push:
    branches: [feat/villa-treves-phase1-20260919]
  pull_request:
    branches: [main]
    paths:
      - 'dist/villa-*.js'
      - 'dist/gameplay-areas.js'
      - 'dist/phase2-runtime.js'
      - 'tools/test-villa-treves-chromium.mjs'
      - '.github/workflows/villa-mandria-webgl.yml'
jobs:
  scene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Start server
        run: |
          node tools/serve.mjs --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 25); do if curl -fsS http://127.0.0.1:4173/ -o /dev/null; then break; fi; sleep 1; done
      - name: Check public Treves and real Mandria scene
        run: node tools/test-villa-treves-chromium.mjs
      - name: Save visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mandria-estate-preview
          path: test-artifacts/
          if-no-files-found: ignore
