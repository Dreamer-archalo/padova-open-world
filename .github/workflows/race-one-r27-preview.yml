name: Race one bots and open bridges R27 preview

on:
  push:
    branches: [fix/race-one-bots-bridges-r27]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover the last published regional map
        run: |
          set -euo pipefail
          for name in venice.json region-padova-venice.json world-padova-venice.json world-terrain.json map-hd-extras.json; do
            found=false
            for label in solo-cars-r26 road-fixes-r25 padova-npc-r17 dealerships-r19 unified; do
              url="https://dreamer-archalo.github.io/padova-open-world/preview/$label/data/$name"
              if curl --fail --silent --show-error --location --max-time 45 "$url" -o "dist/data/$name"; then
                echo "Recovered $name from $label"
                found=true
                break
              fi
            done
            if test "$found" != true && test "$name" != map-hd-extras.json; then
              echo "Missing required regional file: $name" >&2
              exit 1
            fi
          done
      - name: Check regional data and mapped showrooms
        run: |
          set -euo pipefail
          for name in venice.json region-padova-venice.json world-padova-venice.json world-terrain.json; do
            test -s "dist/data/$name"
          done
          node -e "for(const n of ['region-padova-venice','world-padova-venice','world-terrain','venice']){const d=require('./dist/data/'+n+'.json'); if(!d||typeof d!=='object')process.exit(1)}"
          node verify-dealerships-regional.mjs
          node tools/audit-regional-interchanges-r20.mjs
      - name: Verify first race and preserved world geometry
        run: |
          set -euo pipefail
          npm run test:tangenziale-race
          node verify-race-one-difficulty.mjs
          node tools/verify-race-one-r27.mjs
          node verify-feature-preservation.mjs
          node verify-elevation-harmony.mjs
          node verify-geometry-integrity.mjs
          node verify-collector-cars-r26.mjs
      - name: Install Chromium for road mesh verification
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Verify all three race modes and bridge openings in real Chromium
        run: |
          git fetch --no-tags --depth=1 origin ea05ddbd85f887e32850acf51f69ebeba985ba1c
          node tools/test-race-one-r27-browser.mjs
      - name: Retain complete-race timings and bridge comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: race-one-r27-webgl
          path: test-artifacts/r27
          if-no-files-found: ignore
      - name: Verify previously repaired R25 road meshes
        run: node tools/test-northeast-roads-r25-browser.mjs
      - uses: actions/checkout@v6
        with:
          ref: 08872df934e5118b3efa7b69811de9aa3843925c
          path: .prior-solo
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 7ad45f1332c3b95a79518336ddd9a9929d56857d
          path: .prior-road-fixes
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 1a053682b054087a4d36638c459b6afc5295f92d
          path: .prior-road-stunts
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: fix/taxi-confirm-map-r22
          path: .prior-taxi-r22
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: feat/padova-road-levels-r21
          path: .prior-road-levels
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: feat/padova-intelligent-npc-r17
          path: .prior-padova-r17
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: feat/dealerships-urban-showrooms
          path: .prior-dealerships
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: main
          path: .production-source
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: fix/regional-taxi-20260928
          path: .prior-unified
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: feat/padova-venice-continuous-20260925
          path: .prior-continuous
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: feat/venice-world-20260924
          path: .prior-venice
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: feat/monoblocco-elevators-20260924
          path: .pr57
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: fix/shared-street-surface-20260922
          path: .pr56
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: feat/villa-treves-phase1-20260919
          path: .pr51
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 20c6411c215ad57bdc1a57df0f0ae69554d241c2
          path: .pr52
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: cb6d5fb1f3afedfda68f8f07651916d3a8e12f28
          path: .mandria-v11
          persist-credentials: false
      - name: Assemble isolated previews and retain production
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .production-source/dist/index.html .production-source/dist/game.js > /tmp/production-root.sha
          for item in 'race-one-r27 .' 'solo-cars-r26 .prior-solo' 'road-fixes-r25 .prior-road-fixes' 'road-stunts-r23 .prior-road-stunts' 'taxi-r22 .prior-taxi-r22' 'road-levels-r21 .prior-road-levels' 'padova-npc-r17 .prior-padova-r17' 'dealerships .prior-dealerships' 'unified .prior-unified' 'continuous .prior-continuous' 'venice .prior-venice' 'pr-57 .pr57' 'pr-56 .pr56' 'pr-51 .pr51' 'pr-52 .pr52' 'mandria-v11 .mandria-v11'; do
            read -r label source <<< "$item"
            mkdir -p ".production-source/dist/preview/$label"
            cp -a "$source/dist/." ".production-source/dist/preview/$label/"
          done
          for label in unified continuous venice; do
            cp dist/data/venice.json dist/data/world-padova-venice.json dist/data/world-terrain.json ".production-source/dist/preview/$label/data/"
          done
          cp dist/data/region-padova-venice.json .production-source/dist/preview/unified/data/
          cp dist/data/region-padova-venice.json dist/data/world-terrain.json .production-source/dist/preview/padova-npc-r17/data/
          for label in taxi-r22 road-levels-r21 road-stunts-r23 road-fixes-r25 solo-cars-r26; do
            for name in venice.json region-padova-venice.json world-padova-venice.json world-terrain.json; do
              cp "dist/data/$name" ".production-source/dist/preview/$label/data/$name"
            done
          done
          if test -s dist/data/map-hd-extras.json; then
            for label in taxi-r22 road-levels-r21 road-stunts-r23 road-fixes-r25 solo-cars-r26; do
              cp dist/data/map-hd-extras.json ".production-source/dist/preview/$label/data/"
            done
          fi
          for name in venice.json region-padova-venice.json world-padova-venice.json world-terrain.json; do
            cp "dist/data/$name" ".production-source/dist/data/$name"
          done
          if test -s dist/data/map-hd-extras.json; then
            cp dist/data/map-hd-extras.json .production-source/dist/data/
          fi
          touch .production-source/dist/.nojekyll
          test -s .production-source/dist/preview/solo-cars-r26/data/region-padova-venice.json
          grep -q 'game.js?v=solo-cars-r26' .production-source/dist/preview/solo-cars-r26/index.html
          sha256sum -c /tmp/production-root.sha
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .production-source/dist
      - uses: actions/deploy-pages@v4
      - name: Verify the public R27 preview and preserved official release
        run: |
          set -euo pipefail
          base='https://dreamer-archalo.github.io/padova-open-world'
          for name in tangenziale-race-difficulty.js tangenziale-race-runtime-fixes.js phase4-terrain-fixes.js; do
            curl --fail --silent --show-error --location "$base/preview/race-one-r27/$name?v=$GITHUB_SHA" -o "/tmp/r27-$name"
            cmp "dist/$name" "/tmp/r27-$name"
          done
          for name in index.html game.js compact-hud.css phase4-terrain-fixes.js; do
            curl --fail --silent --show-error --location "$base/$name?v=$GITHUB_SHA" -o "/tmp/official-$name"
            cmp ".production-source/dist/$name" "/tmp/official-$name"
          done
      - name: Playtest link
        run: echo 'https://dreamer-archalo.github.io/padova-open-world/preview/race-one-r27/'
