name: Monoblocco rooftop and helipad
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate candidate roof circuit independently
        run: |
          node --check dist/monoblocco-track.js
          node --check dist/monoblocco-roof-network-plan.js
          node --check dist/monoblocco-roof-exploration.js
          node verify-monoblocco-track.mjs
          node verify-monoblocco-roof-network.mjs
          node tools/diagnose-roof-regions.mjs
      - name: Identify genuine roof gaps and access to separate wings
        run: |
          node --check dist/monoblocco-island-bridge-plan.js
          node --check dist/monoblocco-island-bridges.js
          node tools/diagnose-monoblocco-connectors.mjs
          node tools/diagnose-roof-island-bridges.mjs
          node verify-monoblocco-island-bridges.mjs
      - name: Validate rooftop source, elevators and exact real-map polygon route
        run: |
          node --check dist/hospital-rooftop-easter-egg.js
          node --check dist/hospital-helipad-exit.js
          node --check dist/hospital-rooftop-elevators.js
          node --check dist/monoblocco-trial-paddock.js
          node verify-hospital-rooftop.mjs
          node verify-hospital-elevators.mjs
      - name: Verify safe ramp approaches, landings and actual roof-gap bridges
        run: |
          node --check dist/monoblocco-course-polish.js
          node --check dist/monoblocco-raised-bridges.js
          node verify-monoblocco-course-polish.mjs
      - name: Verify spectator positions and active visual cheering
        run: |
          node --check dist/monoblocco-spectators.js
          node verify-monoblocco-spectators.mjs
      - name: Verify previous taxi races and simulated online independently
        if: always()
        run: |
          node verify-geometry-integrity.mjs
          npm run test:taxi
          npm run test:tangenziale-race
          node verify-online-race.mjs
          node verify-online-race-second-fix.mjs
