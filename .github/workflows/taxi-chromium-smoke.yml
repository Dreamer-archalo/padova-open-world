name: Taxi Chromium browser smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/test-taxi-chromium-e2e.mjs'
      - '.github/workflows/taxi-chromium-smoke.yml'
      - 'dist/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary Playwright and Chromium browser
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Run production dist in a separate Chromium browser
        run: |
          node tools/serve.mjs --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 25); do if curl -fsS http://127.0.0.1:4173/ -o /dev/null; then break; fi; sleep 1; done
          node tools/test-taxi-chromium-e2e.mjs
      - name: Preserve browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: taxi-chromium-diagnostics
          path: test-artifacts/
          if-no-files-found: ignore
